# Thai TCG stores to track.
#
# platform:
#   auto        -> tries Shopify, then WooCommerce automatically (start here)
#   shopify     -> reads https://STORE/products.json (most Thai TCG web shops)
#   woocommerce -> reads https://STORE/wp-json/wc/store/v1/products
#   html        -> scrapes a listing page with CSS selectors (see example below)
#
# currency: the currency prices are listed in on that site (THB for Thai shops).
# keywords: only products whose title/type/tags contain one of these are kept,
#           so a shop that also sells Magic or One Piece only contributes Pokémon.

stores:
  - name: Pokesona
    url: https://pokesona.com
    platform: shopify
    currency: THB
    city: Bangkok

  - name: Kira Cards
    url: https://www.kira-cards.com
    platform: jsonld
    currency: THB
    city: Phuket
    pages:
      # type-specific pages first: a product keeps the type of the first page it's found on
      - https://www.kira-cards.com/en/pokemon/booster-boxes
      - https://www.kira-cards.com/en/pokemon/booster-packs
      - https://www.kira-cards.com/en/pokemon/elite-trainer-boxes
      - https://www.kira-cards.com/en/pokemon
      - https://www.kira-cards.com/en/pokemon/english
      - https://www.kira-cards.com/en/pokemon/japanese

  - name: Yannick The Gathering
    url: https://yannickthegathering.com
    platform: nextrsc
    currency: THB
    city: Bangkok
    max_pages: 20
    pages:
      - https://yannickthegathering.com/collections/s/pokemon
      - https://yannickthegathering.com/collections/s/pokemon-sealed
      - https://yannickthegathering.com/collections/pokemon

  - name: Thai PKMN
    url: https://thaipkmn.shop
    platform: woocommerce
    currency: THB
    city: Thailand
    keywords: []           # a Pokémon shop whose titles are just card names, so keep everything...
    exclude: [street fighter, sf zero, naruto, one piece, dragon ball, vanguard, grading]   # ...except its other games and services
    exclude_urls: [/fr/]   # the same cards again under their French names
    # Street Fighter singles are titled just "<character> <rarity>", e.g. "Guile SR"
    exclude_title_regex: "^(violent ken|honda|balrog|guile|vega|ryu|ken|chun-li|blanka|dhalsim|zangief|e\\. ?honda|m\\. ?bison|sagat|cammy|akuma|gouki|sakura|rose|adon|birdie|guy|sodom|nash|charlie|rolento|dee jay|fei long|t\\. ?hawk|gen|dan|karin|rainbow mika|cody|juri|abel|rufus|seth|elena|ibuki|makoto|oro|yun|yang|alex|dudley|necro|remy|hugo|urien|gill|q|twelve|sean)\\b"

  - name: Big Bear Cards
    url: https://bigbearcards.com
    platform: shopify
    currency: THB
    city: Bangkok
    daily: true            # mostly Magic cards: reading the whole catalogue takes ~7 min, so once a day

  # SASOM is a marketplace (lowest price from its sellers). Its robots.txt doesn't allow following
  # page numbers, so only the products shown on the first page of each list are included.
  - name: SASOM
    url: https://sasom.co.th
    platform: jsonld
    currency: THB
    city: Bangkok
    pages:
      - https://sasom.co.th/en/shop/collectibles/pokemon
      - https://sasom.co.th/en/brand/pokemon
      - https://sasom.co.th/en/shop/trading-card-box-and-pack
      - https://sasom.co.th/th/brand/pokemon

  # Not included (checked Nov 2026): Cardify / Kingdom Come (no Pokémon products online),
  # TCG Nexus (domain for sale), Nx Gallery (site down). Facebook/Instagram-only shops can't be read.

  # VG card shop (LnwShop) times out from GitHub's servers (likely blocks non-Thai visitors).
  # - name: VG card shop
  #   url: https://www.vgcardshop.com

  # Example of a custom HTML store (copy, fill in, remove the leading #):
  # - name: Example Shop
  #   url: https://example-shop.co.th
  #   platform: html
  #   currency: THB
  #   pages:                      # listing pages to read ({page} = 1,2,3...)
  #     - https://example-shop.co.th/category/pokemon?page={page}
  #   max_pages: 20
  #   selectors:
  #     item: .product-card
  #     title: .product-title
  #     price: .price
  #     link: a
  #     image: img
  #     sold_out: .sold-out       # optional: element present = out of stock

keywords: [pokemon, pokémon, โปเกมอน, ptcg]

# Products whose title contains any of these are skipped (accessories, not cards or sealed product).
exclude: [keychain, sleeve, binder, playmat, toploader, top loader, card saver, deck box, deckbox,
          figure, plush, sticker, mystery box, ซองใส, แฟ้ม]
