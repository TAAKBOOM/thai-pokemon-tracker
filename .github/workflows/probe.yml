name: Probe shop websites (setup helper)
on:
  workflow_dispatch:
    inputs:
      sites:
        description: "Space-separated shop URLs"
        required: true
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: python tools/probe.py ${{ inputs.sites }}
      - uses: actions/upload-artifact@v4
        with:
          name: probe-out
          path: probe-out
