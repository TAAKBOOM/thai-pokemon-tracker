<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thai TCG Price Tracker</title>
<style>
  :root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
  :root{
    color-scheme:light dark;
    --bg:light-dark(#f6f4ef,#14161c); --card:light-dark(#fff,#1d2029); --ink:light-dark(#1b1d24,#eceae4);
    --muted:light-dark(#6b6f7b,#9ea2ad); --line:light-dark(#e6e2d9,#2c303b); --soft:light-dark(#f0eee8,#262a34);
    --accent:light-dark(#2f5bea,#7c9bff); --good:light-dark(#0f8a5f,#4fd19e); --good-bg:light-dark(#e3f5ec,#123527);
    --bad:light-dark(#b4372f,#ff8a80); --bad-bg:light-dark(#fbe7e4,#3a1c1a);
    --warn:light-dark(#9a6a00,#f2c45a); --warn-bg:light-dark(#fff3d6,#33290f); --radius:14px;
    font-family: "IBM Plex Sans Thai","Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
  header{padding:28px 20px 18px;max-width:1040px;margin:0 auto}
  h1{font-size:26px;margin:0 0 4px;letter-spacing:-.02em}
  h1 span{color:var(--accent)}
  .sub{color:var(--muted);margin:0}
  .demo{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn);padding:8px 12px;border-radius:10px;margin-top:12px;font-size:13.5px}
  main{max-width:1040px;margin:0 auto;padding:0 20px 60px}
  .controls{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  #q{flex:1 1 320px;font:inherit;font-size:16px;padding:12px 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);outline:none}
  #q:focus{border-color:var(--accent)}
  .seg{display:flex;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
  .seg button{font:inherit;border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted)}
  .seg button.on{background:var(--ink);color:var(--bg)}
  select,label.chk{font:inherit;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink)}
  label.chk[hidden],select[hidden]{display:none}
  label.chk{display:flex;gap:6px;align-items:center;cursor:pointer}
  .tabs{display:flex;gap:4px;border-bottom:1.5px solid var(--line);margin:2px 0 0}
  .tabs button{font:inherit;font-size:16px;font-weight:600;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1.5px;padding:10px 14px;color:var(--muted);cursor:pointer;min-height:44px}
  .tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
  .controls.filters{position:static;padding-top:12px}
  .count{color:var(--muted);font-size:13.5px;margin:4px 0 12px}
  .p{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
  .head{display:grid;grid-template-columns:64px 1fr auto;gap:14px;padding:14px;align-items:center}
  .thumb{width:64px;height:88px;border-radius:8px;background:var(--soft);object-fit:contain;display:flex;align-items:center;justify-content:center;color:#b5ae9e;font-size:11px;text-align:center}
  .name{font-weight:650;font-size:16.5px}
  .meta{color:var(--muted);font-size:13.5px;margin-top:2px}
  .tags{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
  .tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--muted)}
  .prices{text-align:right;white-space:nowrap}
  .best{font-size:20px;font-weight:700}
  .lbl{font-size:12px;color:var(--muted)}
  .tcg{font-size:13.5px;color:var(--muted);margin-top:2px}
  .badge{display:inline-block;font-size:12.5px;font-weight:650;padding:2px 8px;border-radius:99px;margin-top:4px}
  .below{background:var(--good-bg);color:var(--good)}
  .above{background:var(--bad-bg);color:var(--bad)}
  .body{border-top:1px solid var(--line);padding:6px 14px 14px}
  .shops-h{font-size:12.5px;color:var(--muted);font-weight:600;padding:8px 0 6px}
  .shop{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px}
  .shop.top{border-color:var(--good);background:var(--good-bg)}
  .shop.oos{opacity:.55}
  .ltitle{font-size:12.5px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
  .cheap{font-size:11.5px;font-weight:700;color:var(--good);margin-left:4px}
  .sprice{text-align:right;white-space:nowrap}.sprice b{font-size:17px;font-variant-numeric:tabular-nums}
  .buy{font-size:14px;font-weight:600;border:1.5px solid var(--accent);border-radius:10px;padding:9px 12px;white-space:nowrap;min-height:40px;display:inline-flex;align-items:center}
  .buy:hover{background:var(--accent);color:var(--bg);text-decoration:none}
  .buy.off{border-color:var(--line);color:var(--muted)}
  @media (max-width:640px){.shop{grid-template-columns:minmax(0,1fr) auto}.buy{grid-column:1/-1;justify-content:center}}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:10px 8px 6px;border-bottom:1px solid var(--line)}
  td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  td.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  th.num{text-align:right}
  tr.oos td{color:#a8a59c}
  a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
  .note{font-size:12.5px;color:var(--warn);background:var(--warn-bg);padding:6px 10px;border-radius:8px;margin-top:10px}
  .spark{margin-top:10px;display:flex;gap:14px;align-items:center;font-size:12.5px;color:var(--muted)}
  footer{max-width:1040px;margin:0 auto;padding:0 20px 40px;color:var(--muted);font-size:13px}
  .stores{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .st{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
  .st.fail{border-color:#f0c3bd;color:var(--bad)}
  .empty{text-align:center;color:var(--muted);padding:50px 0}
  @media (max-width:640px){
    .head{grid-template-columns:48px 1fr}
    .thumb{width:48px;height:66px}
    .prices{grid-column:1/-1;text-align:left;display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
    .hide-sm{display:none}
  }
</style>
</head>
<body>
<header>
  <h1>Thai TCG <span>Price Tracker</span></h1>
  <p class="sub">Every Pokémon single and sealed product from Thai card shops, side by side with TCGplayer.</p>
  <div id="demo" class="demo" hidden></div>
</header>
<main>
  <div class="controls">
    <input id="q" type="search" placeholder="Search a card or product… e.g. rayquaza storm emeralda" autocomplete="off">
  </div>
  <nav class="tabs" id="view">
    <button data-v="all" class="on">All products</button><button data-v="deals">Deals</button>
  </nav>
  <div class="controls filters">
    <div class="seg" id="kind">
      <button data-k="all" class="on">All</button><button data-k="single">Singles</button><button data-k="sealed">Sealed</button>
    </div>
    <select id="lang" aria-label="Card language">
      <option value="all">All languages</option>
      <option value="EN">English</option>
      <option value="JP">Japanese</option>
      <option value="TH">Thai</option>
    </select>
    <select id="sort">
      <option value="stores">Most stores</option>
      <option value="low">Price: low to high</option>
      <option value="high">Price: high to low</option>
    </select>
    <label class="chk"><input type="checkbox" id="stock" checked> In stock only</label>
  </div>
  <div class="count" id="count"></div>
  <div id="list"></div>
</main>
<footer id="foot"></footer>

<script>
const DEMO_DATA = null; /*DEMO_DATA*/
const $ = s => document.querySelector(s);
const thb = n => n == null ? "–" : "฿" + Math.round(n).toLocaleString("en-US");
const usd = n => n == null ? "–" : "$" + n.toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fold = s => String(s || "").toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9ก-๙/]+/g, " ");

let DATA, HIST = {}, kindF = "all", viewF = "all";

async function load() {
  if (DEMO_DATA) { DATA = DEMO_DATA; HIST = DEMO_DATA.history || {}; }
  else {
    DATA = await fetch("data/data.json", {cache: "no-cache"}).then(r => r.json());
    try { HIST = await fetch("data/history.json", {cache: "no-cache"}).then(r => r.json()); } catch (e) {}
  }
  if (DATA.demo) { $("#demo").hidden = false; $("#demo").textContent = DATA.demo; }
  for (const p of DATA.products) {
    p._text = fold([p.name, p.set, p.number, p.tcg && p.tcg.name, ...p.listings.map(l => l.title)].join(" "));
  }
  const q = new URLSearchParams(location.search).get("q");
  if (q) $("#q").value = q;
  render(); footer();
}

function diffPct(price, p) {
  const m = p.tcg && p.tcg.market_thb;
  return (price && m) ? (price - m) / m * 100 : null;
}

function badge(pct) {
  if (pct == null) return "";
  const cls = pct <= 0 ? "below" : "above";
  const word = pct <= 0 ? "below" : "above";
  return `<span class="badge ${cls}">${Math.abs(pct).toFixed(0)}% ${word} TCGplayer</span>`;
}

// Which language a listing is: what the shop says, else the TCGplayer product it matched.
function langOf(l, p) {
  return l.lang || (l.match && l.match !== "approx" && p.tcg ? p.tcg.lang : null);
}

// The listings a product shows under the current filters.
function visible(p) {
  const lang = $("#lang").value, stockOnly = viewF === "deals" || $("#stock").checked;
  return p.listings.filter(l => (lang === "all" || langOf(l, p) === lang) && (!stockOnly || l.in_stock));
}

// A deal = cheapest in-stock listing priced below TCGplayer. Thai-language listings are left out
// because they're compared with the Japanese card, which isn't a like-for-like price.
function dealPrice(p) {
  const ok = p._ls.filter(l => l.in_stock && l.match !== "approx").map(l => l.price_thb);
  return ok.length ? Math.min(...ok) : null;
}
const dealPct = p => diffPct(dealPrice(p), p);

function render() {
  const words = fold($("#q").value).split(" ").filter(Boolean);
  const deals = viewF === "deals";
  $("#sort").hidden = deals; $("#stock").parentNode.hidden = deals;
  for (const p of DATA.products) p._ls = visible(p);
  let rows = DATA.products.filter(p =>
    (kindF === "all" || p.kind === kindF) &&
    words.every(w => p._text.includes(w)) &&
    p._ls.length &&
    (!deals || (dealPct(p) ?? 0) < 0));
  const price = p => deals ? dealPrice(p) : Math.min(...p._ls.filter(l => l.in_stock).map(l => l.price_thb), ...(p._ls.some(l => l.in_stock) ? [] : p._ls.map(l => l.price_thb)));
  if (deals) rows.sort((a, b) => dealPct(a) - dealPct(b));
  else rows.sort({
    stores: (a, b) => b._ls.length - a._ls.length,
    low: (a, b) => price(a) - price(b),
    high: (a, b) => price(b) - price(a),
  }[$("#sort").value]);
  const n = rows.length.toLocaleString(), plural = rows.length === 1 ? "" : "s";
  const what = {all: "product", single: "single", sealed: "sealed product"}[kindF];
  const langName = {all: "", EN: "English ", JP: "Japanese ", TH: "Thai "}[$("#lang").value];
  $("#count").textContent = (deals ? `${n} ${langName}${what}${plural} cheaper in Thailand than on TCGplayer, biggest saving first`
    : `${n} ${langName}${what}${plural}`) + (words.length ? ` matching “${$("#q").value.trim()}”` : "");
  const shown = rows.slice(0, 200);
  $("#list").innerHTML = shown.length ? shown.map(p => card(p, price(p), true)).join("")
    : `<div class="empty">${deals ? "No deals for these filters right now: no store is selling below the TCGplayer price." : "No products found. Try a shorter search, another language, or untick “In stock only”."}</div>`;
}

function card(p, best, open) {
  const t = p.tcg;
  const ls = p._ls;
  const storesN = new Set(ls.map(l => l.store)).size;
  const approx = ls.some(l => l.match === "approx");
  const img = p.image ? `<img class="thumb" loading="lazy" src="${esc(p.image)}" alt="">` : `<div class="thumb">${p.kind === "sealed" ? "Sealed" : "Card"}</div>`;
  const tags = [p.kind === "sealed" ? "Sealed" : "Single", t && t.rarity, t && ({EN: "English", JP: "Japanese"}[t.lang])].filter(Boolean);
  return `<div class="p${open ? " open" : ""}">
    <div class="head">
      ${img}
      <div><div class="name">${esc(p.name)}</div>
        <div class="meta">${esc([p.set, p.number].filter(Boolean).join(" · ") || "Not matched to TCGplayer")}</div>
        <div class="tags">${tags.map(x => `<span class="tag">${esc(x)}</span>`).join("")}<span class="tag">${storesN} store${storesN === 1 ? "" : "s"}</span></div>
      </div>
      <div class="prices">
        <div><div class="lbl">Best in Thailand</div><div class="best">${thb(best)}</div></div>
        <div><div class="tcg">TCGplayer ${t && t.market ? `${thb(t.market_thb)} <span class="hide-sm">(${usd(t.market)})</span>` : "–"}</div>${badge(diffPct(best, p))}</div>
      </div>
    </div>
    <div class="body">
      <div class="shops-h">${storesN ? `Selling now · cheapest first` : `No store has this in stock right now`}</div>
      ${ls.map((l, i) => {
        const d = diffPct(l.price_thb, p);
        return `<div class="shop${l.in_stock ? "" : " oos"}${i === 0 && l.in_stock ? " top" : ""}">
          <div class="sname"><b>${esc(l.store)}</b>${i === 0 && l.in_stock ? ` <span class="cheap">Cheapest</span>` : ""}<div class="ltitle">${esc(l.title)}</div></div>
          <div class="sprice"><b>${thb(l.price_thb)}</b>${l.currency !== "THB" ? `<div class="lbl">${esc(l.currency)} ${l.price}</div>` : ""}
            <div class="lbl">${l.in_stock ? "In stock" : "Sold out"}${d == null ? "" : ` · <span style="color:var(--${d <= 0 ? "good" : "bad"})">${d > 0 ? "+" : ""}${d.toFixed(0)}% vs TCGplayer</span>`}</div></div>
          ${l.url ? `<a class="buy" href="${esc(l.url)}" target="_blank" rel="noopener">View in store</a>` : ""}
        </div>`;
      }).join("")}
      ${t ? `<div class="spark">${spark(p.key)}<span>TCGplayer market ${usd(t.market)}${t.printing ? " · " + esc(t.printing) : ""}${t.low ? " · low " + usd(t.low) : ""} · <a href="${esc(t.url)}" target="_blank" rel="noopener">View on TCGplayer</a></span></div>` : ""}
      ${approx ? `<div class="note">Thai-language listing: TCGplayer doesn't sell Thai cards, so this compares against the ${t && t.lang === "EN" ? "English" : "Japanese"} version of the same card.</div>` : ""}
    </div></div>`;
}

function spark(key) {
  const h = HIST[key];
  if (!h || h.length < 2) return "";
  const W = 160, H = 34, vals = h.flatMap(r => [r[1], r[2]]).filter(v => v != null);
  const lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1;
  const line = idx => h.map((r, i) => r[idx] == null ? null : `${(i / (h.length - 1) * W).toFixed(1)},${(H - 3 - (r[idx] - lo) / span * (H - 6)).toFixed(1)}`).filter(Boolean).join(" ");
  return `<svg width="${W}" height="${H}" aria-label="Price history"><polyline fill="none" stroke="#9aa3b5" stroke-width="1.5" stroke-dasharray="3 3" points="${line(2)}"/><polyline fill="none" stroke="var(--accent)" stroke-width="2" points="${line(1)}"/></svg><span><b style="color:var(--accent)">—</b> best Thai price · <b style="color:#9aa3b5">- -</b> TCGplayer, last ${h.length} days</span>`;
}

function footer() {
  const d = new Date(DATA.updated);
  $("#foot").innerHTML = `Prices updated ${d.toLocaleString("en-GB", {dateStyle: "medium", timeStyle: "short"})} · USD→THB ${DATA.usd_thb.toFixed(2)} · TCGplayer prices via tcgcsv.com
    <div class="stores">${DATA.stores.map(s => `<span class="st${s.ok ? "" : " fail"}">${esc(s.name)}: ${s.ok ? s.listings.toLocaleString() + " listings" : "couldn't update"}</span>`).join("")}</div>`;
}

let timer;
$("#q").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(render, 120); });
$("#sort").addEventListener("change", render);
$("#stock").addEventListener("change", render);
$("#lang").addEventListener("change", render);
$("#view").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  viewF = b.dataset.v; document.querySelectorAll("#view button").forEach(x => x.classList.toggle("on", x === b)); render();
});
$("#kind").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  kindF = b.dataset.k; document.querySelectorAll("#kind button").forEach(x => x.classList.toggle("on", x === b)); render();
});
load().catch(e => { $("#list").innerHTML = `<div class="empty">Couldn't load price data (${esc(e.message)}). Run the scraper first.</div>`; });
</script>
</body>
</html>
